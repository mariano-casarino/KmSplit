<div class="screen">
  <div class="group-header">
    <h1>¿Dónde vamos a cargar tus km hoy?</h1>
    <div class="auth-actions">
      <a class="icon-btn" routerLink="/perfil" aria-label="Ver mi perfil">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </a>
      <button class="icon-btn" type="button" (click)="requestLogout()" aria-label="Cerrar sesión">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </div>

  <p class="muted group-hint">Elegí el grupo con el que compartís gastos hoy.</p>

  @if (loading()) {
    <p class="muted">Cargando...</p>
  } @else if (errorMessage()) {
    <p class="field-error">{{ errorMessage() }}</p>
  } @else {
    <div class="group-list">
      @for (group of groups(); track group.id) {
        <button
          class="group-card"
          [class.is-active]="isActive(group)"
          type="button"
          (click)="selectGroup(group)"
          [disabled]="selectingId() === group.id"
        >
          <div class="group-avatar">👥</div>
          <div class="group-info">
            <p class="group-name">{{ group.name }}</p>
            <p class="muted group-meta">
              {{ memberCount(group) }} integrante{{ memberCount(group) === 1 ? '' : 's' }}
              · {{ myRole(group) }}
            </p>
          </div>
          @if (isActive(group)) {
            <span class="active-badge">{{ lastAccessLabel(group) }}</span>
          } @else {
            <span class="group-arrow">›</span>
          }
        </button>
      }
    </div>

    <div class="group-actions">
      <a class="btn btn-secondary" routerLink="/grupos/crear">+ Crear grupo nuevo</a>
      <a class="btn btn-secondary" routerLink="/grupos/unirse">Unirme a un grupo existente</a>
    </div>
  }
</div>

@if (pendingLogout()) {
  <app-confirm-dialog
    title="Cerrar sesión"
    message="¿Querés cerrar tu sesión? Vas a tener que volver a iniciar sesión para cargar datos."
    confirmLabel="Cerrar sesión"
    variant="danger"
    [busy]="loggingOut()"
    (confirmed)="confirmLogout()"
    (cancelled)="cancelLogout()"
  />
}
